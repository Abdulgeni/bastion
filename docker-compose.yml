# Bastion, five-network topology. See Step 1's F1/F2.

name: bastion

networks:
  frontend:
    name: bastion-frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  inventory:
    name: bastion-inventory
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  payments:
    name: bastion-payments
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  vault:
    name: bastion-vault
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
  mgmt:
    name: bastion-mgmt
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.24.0.0/24

volumes:
  jwt-keys:

services:
  bastion-init:
    build:
      context: .
      dockerfile: docker/init.Dockerfile
    image: bastion-init:dev
    working_dir: /repo
    command: ["pnpm", "exec", "ts-node", "scripts/init.ts"]
    environment:
      BASTION_VAR_DIR: /var/bastion
    volumes:
      - ./var:/var/bastion
      - jwt-keys:/var/bastion/jwt
    network_mode: "none"
    restart: "no"

  vault:
    image: hashicorp/vault:1.17.2
    container_name: bastion-vault
    depends_on:
      bastion-init:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - ./var:/var/bastion:ro
    networks:
      vault:
        ipv4_address: 172.23.0.10
    ports: []
    cap_add:
      - IPC_LOCK
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export VAULT_DEV_ROOT_TOKEN_ID="$$(cat /var/bastion/vault/root-token)"
        exec docker-entrypoint.sh server -dev -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15

  bastion-vault-bootstrap:
    build:
      context: .
      dockerfile: docker/init.Dockerfile
    image: bastion-init:dev
    depends_on:
      vault:
        condition: service_healthy
    working_dir: /repo
    entrypoint: ["/bin/bash", "/repo/scripts/vault-bootstrap.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /var/bastion/vault/root-token
      VAR_DIR: /var/bastion
    volumes:
      - ./var:/var/bastion
      - jwt-keys:/var/bastion/jwt
    networks:
      vault:
        ipv4_address: 172.23.0.11
    restart: "no"

  edge:
    build:
      context: .
      dockerfile: apps/edge/Dockerfile
    image: bastion-edge:dev
    depends_on:
      bastion-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: edge
      NODE_ENV: production
      BASTION_VAR_DIR: /var/bastion
      DATA_BIND_ADDR: 0.0.0.0
      MGMT_BIND_ADDR: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BASTION_TRUST_DOMAIN: ${BASTION_TRUST_DOMAIN:-bastion.local}
    volumes:
      - ./var:/var/bastion:ro
      - ./var/audit:/var/bastion/audit
      - jwt-keys:/var/bastion/jwt:ro
    networks:
      frontend:
        ipv4_address: 172.20.0.10
      mgmt:
        ipv4_address: 172.24.0.10
    ports:
      - "${EDGE_DATA_HOST_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s

  orders:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile
    image: bastion-orders:dev
    depends_on:
      bastion-init:
        condition: service_completed_successfully
      edge:
        condition: service_healthy
    environment:
      SERVICE_NAME: orders
      NODE_ENV: production
      BASTION_VAR_DIR: /var/bastion
      DATA_BIND_ADDR: 0.0.0.0
      MGMT_BIND_ADDR: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BASTION_TRUST_DOMAIN: ${BASTION_TRUST_DOMAIN:-bastion.local}
      JWKS_URL: http://edge:9090/.well-known/jwks.json
    volumes:
      - ./var:/var/bastion:ro
      - ./var/audit:/var/bastion/audit
      - jwt-keys:/var/bastion/jwt:ro
    networks:
      inventory:
        ipv4_address: 172.21.0.10
      payments:
        ipv4_address: 172.22.0.10
      mgmt:
        ipv4_address: 172.24.0.11
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9091/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s

  inventory:
    build:
      context: .
      dockerfile: apps/inventory/Dockerfile
    image: bastion-inventory:dev
    depends_on:
      bastion-init:
        condition: service_completed_successfully
      edge:
        condition: service_healthy
    environment:
      SERVICE_NAME: inventory
      NODE_ENV: production
      BASTION_VAR_DIR: /var/bastion
      DATA_BIND_ADDR: 0.0.0.0
      MGMT_BIND_ADDR: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BASTION_TRUST_DOMAIN: ${BASTION_TRUST_DOMAIN:-bastion.local}
      JWKS_URL: http://edge:9090/.well-known/jwks.json
    volumes:
      - ./var:/var/bastion:ro
      - ./var/audit:/var/bastion/audit
      - jwt-keys:/var/bastion/jwt:ro
    networks:
      inventory:
        ipv4_address: 172.21.0.11
      mgmt:
        ipv4_address: 172.24.0.12
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9092/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s

  payments:
    build:
      context: .
      dockerfile: apps/payments/Dockerfile
    image: bastion-payments:dev
    depends_on:
      bastion-init:
        condition: service_completed_successfully
      bastion-vault-bootstrap:
        condition: service_completed_successfully
      edge:
        condition: service_healthy
    environment:
      SERVICE_NAME: payments
      NODE_ENV: production
      BASTION_VAR_DIR: /var/bastion
      DATA_BIND_ADDR: 0.0.0.0
      MGMT_BIND_ADDR: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BASTION_TRUST_DOMAIN: ${BASTION_TRUST_DOMAIN:-bastion.local}
      JWKS_URL: http://edge:9090/.well-known/jwks.json
      VAULT_ADDR: http://vault:8200
      VAULT_KEY_TTL_SECONDS: ${VAULT_KEY_TTL_SECONDS:-10}
    volumes:
      - ./var:/var/bastion:ro
      - ./var/audit:/var/bastion/audit
      - jwt-keys:/var/bastion/jwt:ro
    networks:
      payments:
        ipv4_address: 172.22.0.11
      vault:
        ipv4_address: 172.23.0.12
      mgmt:
        ipv4_address: 172.24.0.13
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9093/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s

  tools:
    build:
      context: .
      dockerfile: docker/init.Dockerfile
    image: bastion-init:dev
    profiles: ["tools"]
    networks:
      mgmt:
        ipv4_address: 172.24.0.50
    volumes:
      - jwt-keys:/var/bastion/jwt:ro
    command: ["sleep", "infinity"]
    restart: "no"

  rogue:
    build:
      context: .
      dockerfile: docker/rogue.Dockerfile
    image: bastion-rogue:dev
    profiles: ["rogue"]
    depends_on:
      bastion-init:
        condition: service_completed_successfully
    volumes:
      - ./var:/var/bastion:ro
    networks:
      frontend:
        ipv4_address: 172.20.0.50
    command: ["sleep", "infinity"]
    restart: "no"
