apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: bastion
  labels: { app: inventory }
spec:
  replicas: 1
  selector:
    matchLabels: { app: inventory }
  template:
    metadata:
      labels: { app: inventory }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: inventory
          image: bastion-inventory:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: inventory }
            - { name: NODE_ENV, value: production }
            - { name: BASTION_VAR_DIR, value: /var/bastion }
            - { name: DATA_BIND_ADDR, value: 0.0.0.0 }
            - { name: MGMT_BIND_ADDR, value: 0.0.0.0 }
            - { name: BASTION_TRUST_DOMAIN, value: bastion.local }
            - { name: JWKS_URL, value: http://edge:9090/.well-known/jwks.json }
          ports:
            - { name: data, containerPort: 8444 }
            - { name: mgmt, containerPort: 9092 }
          volumeMounts:
            - { name: var, mountPath: /var/bastion }
          readinessProbe:
            httpGet: { path: /healthz, port: mgmt }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: mgmt }
            initialDelaySeconds: 20
      volumes:
        - name: var
          persistentVolumeClaim: { claimName: bastion-var }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: bastion
spec:
  selector: { app: inventory }
  ports:
    - { name: data, port: 8444, targetPort: data }
    - { name: mgmt, port: 9092, targetPort: mgmt }
